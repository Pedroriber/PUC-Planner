{% extends "base.html" %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div style="padding: 2rem; max-width: 600px; margin: 0 auto;">
    <h1>Confirmar Exclusão</h1>
    
    <div style="padding: 1rem; margin: 1rem 0; background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 4px;">
        <p>Tem certeza que deseja deletar a disciplina <strong>{{ course.code }} - {{ course.name }}</strong>?</p>
        <p style="margin-top: 0.5rem; color: #856404;">Esta ação não pode ser desfeita.</p>
    </div>
    
    <form method="post" style="margin-top: 1.5rem;">
        {% csrf_token %}
        <button type="submit" style="padding: 0.5rem 1rem; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Sim, Deletar
        </button>
        <a href="{% url 'course_list' %}" style="padding: 0.5rem 1rem; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; margin-left: 0.5rem;">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
