{% extends 'base.html' %}
{% load static %}

{% block title %}Cadastro - PUC Planner{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/tela_cadastro_styles.css' %}">
{% endblock %}

{% block content %}
<header class="cabecalho">
    <div class="logo">
        <img src="{% static 'images/logo_puc_planner_fundoazul.svg' %}" alt="PUC Planner Logo">
    </div>
    <h1 class="titulo-pagina">Crie sua conta</h1>
    <div class="espacador"></div>
</header>

<main class="conteudo-principal">
    <div class="cadastro-container">
        <h2 class="titulo-formulario">Preencha seus dados</h2>
        <form class="formulario" method="post">
            {% csrf_token %}
            
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <i class="fas fa-id-card icon"></i>
                <input type="text" id="matricula" name="matricula" placeholder="Matrícula" required>
            </div>

            <div class="input-group">
                <i class="fas fa-envelope icon"></i>
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="senha" name="senha" placeholder="Senha" required>
            </div>

            <button type="submit" class="botao-cadastro">CADASTRAR</button>
        </form>
        
        <p class="login-link">
            Já tem uma conta? <a href="{% url 'login' %}">Faça Login</a>
        </p>
    </div>
</main>

{% include 'includes/footer_auth.html' %}
{% endblock %}
